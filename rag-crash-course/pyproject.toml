[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-crash-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi[standard]>=0.141.1",
  "langchain>=1.3.14",
  "langchain-community<0.4",
  "langchain-openai>=1.4.1",
  "langchain-pinecone>=0.2.13",
  "langchain-text-splitters>=1.1.2",
  "numpy>=2.5.1",
  "pinecone>=7.3.0",
  "pydantic-settings>=2.14.2",
  "pypdf>=6.14.2",
  "python-dotenv>=1.2.2",
  "ragas>=0.4.3",
  "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = ["ruff>=0.16.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# ── Ruff configuration ─────────────────────────────────────────────────────
[tool.ruff]
line-length = 98

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes (unused imports, undefined names)
  "I",   # isort (import ordering)
  "UP",  # pyupgrade (suggest modern Python syntax)
  "B",   # flake8-bugbear (common bugs and design problems)
  "SIM", # flake8-simplify (suggests simpler code)
]
# Ignore specific rules that conflict with AI/ML patterns
ignore = ["E501", "B904", "B008"] # Line length handled by formatter, not linter
unfixable = ["F401"]              # give warining to unused variable but won't delete it
[tool.ruff.format]
# Match Black's quote style so diff noise is minimal if you ever migrate
quote-style = "double"
indent-style = "space"
